services:
  postgres:
    image: postgres:17
    container_name: datathon-postgres
    environment:
      POSTGRES_DB: datathon
      POSTGRES_USER: datathon
      POSTGRES_PASSWORD: datathon
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datathon -d datathon"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
