spring:
  application:
    name: api
  config:
    # Rule thresholds with validity dates (docs/ANOMALY_DETECTION.md §0.5), kept apart from technical settings.
    import: "classpath:config/thresholds.yaml"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/javniradar}
    username: ${DB_USER:javniradar}
    password: ${DB_PASSWORD:javniradar}
  jpa:
    hibernate:
      # Schema comes from Flyway (db/migration); Hibernate only checks that entities match it.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

# /api/admin routes need header X-Admin-Token equal to this; empty = every admin call is refused.
admin:
  key: ${ADMIN_TOKEN:}

javniradar:
  ingest:
    cache-dir: ${INGEST_CACHE_DIR:./data/cache}
    query: registar ugovora
  # AI assessment (docs/ANOMALY_DETECTION.md §4). Without ANTHROPIC_API_KEY the app and the rules run as usual and
  # an AI run answers "AI nije konfiguriran". The selection heuristics are in config/thresholds.yaml (javniradar.ai.selection).
  ai:
    model: ${AI_MODEL:claude-haiku-5-5}
    recheck-model: ${AI_RECHECK_MODEL:claude-sonnet-5-5}
    effort: ${AI_EFFORT:medium}
    max-tokens: ${AI_MAX_TOKENS:8000}
    max-usd-per-run: ${AI_MAX_USD_PER_RUN:2.0}
    max-calls-per-run: ${AI_MAX_CALLS_PER_RUN:300}
    # Parallel model calls; the budget can be overshot by at most this many calls.
    concurrency: 4
    # USD per million tokens. Source: skill claude-api, "Current Models" table (cached 2026-10-06), Anthropic
    # first-party rates; Haiku 5.5 price is for prompts up to 100K tokens. Check before a large run.
    prices:
      claude-haiku-5-5: { input: 0.10, output: 0.50 }
      claude-sonnet-5-5: { input: 2.00, output: 10.00 }
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    connect-timeout-seconds: 5
    read-timeout-seconds: 90
    # One retry for 429/5xx; after that the contract stays without an assessment and the run goes on.
    max-retries: 1
