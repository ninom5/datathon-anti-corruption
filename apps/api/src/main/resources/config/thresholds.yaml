# Thresholds for JavniRadar rules (docs/ANOMALY_DETECTION.md §0.5: configuration with validity dates, never in code).
# Values are copied ONLY from docs/DATA_SOURCES.md §10 and docs/ANOMALY_DETECTION.md §D, which cite
# ZJN as amended by NN 48/26 (in force 16.05.2026). Nothing here is from memory.
# A period is chosen by the contract's date_signed, never by today's date (DATA_SOURCES.md §10, "Pravilo").
# valid-from empty = the start of the period is not stated in docs/ (the table only says "Do 15.05.2026.").
javniradar:
  thresholds:
    # Contract modification limits as a share of the initial value.
    # DATA_SOURCES.md §10 lists the same values before and after NN 48/26 ("isto"); two periods are kept so the
    # amendment date stays visible and a future change only needs a new entry.
    contract-modification:
      - valid-from:
        valid-to: 2026-05-15
        de-minimis-goods-services: 0.10   # ZJN čl. 320 (DATA_SOURCES.md §10)
        de-minimis-works: 0.15            # ZJN čl. 320
        additional-supplies: 0.30         # ZJN čl. 316 st. 2 (dodatni radovi/usluge/robe)
        unforeseen-circumstances: 0.50    # ZJN čl. 317 (nepredviđene okolnosti)
        source: "ZJN čl. 316 st. 2, 317, 320; docs/DATA_SOURCES.md §10 (stupac 'Do 15.05.2026.')"
      - valid-from: 2026-05-16
        valid-to:
        de-minimis-goods-services: 0.10
        de-minimis-works: 0.15
        additional-supplies: 0.30
        unforeseen-circumstances: 0.50
        source: "ZJN čl. 316 st. 2, 317, 320 (NN 48/26); docs/DATA_SOURCES.md §10 (stupac 'Od 16.05.2026.')"

    # Simple procurement (ZJN does not apply below these). Used by rule F; kept here so all ZJN values live in one place.
    # 2017-2022: ZJN 2016 čl. 12 st. 1 (NN 120/16) in kuna, checked in the official text on 2026-11-03
    # (DATA_SOURCES.md §10). Contract amounts are stored in EUR at the fixed rate 7,53450, so the threshold is
    # converted the same way (200.000 / 7,53450 = 26.544,56; 500.000 / 7,53450 = 66.361,40).
    simple-procurement:
      - valid-from: 2017-01-01
        valid-to: 2022-12-31
        goods-services: 26544.56          # 200.000,00 kn
        works: 66361.40                   # 500.000,00 kn
        source: "ZJN čl. 12 st. 1, NN 120/16 (200.000 kn / 500.000 kn), na snazi od 01.01.2017. (čl. 452); preračun 7,53450"
      - valid-from: 2023-01-01
        valid-to: 2026-05-15
        goods-services: 26540
        works: 66360
        source: "ZJN čl. 12 st. 1; docs/DATA_SOURCES.md §10, ANOMALY_DETECTION.md §F"
      - valid-from: 2026-05-16
        valid-to:
        goods-services: 50000
        works: 100000
        source: "ZJN čl. 12 st. 1 (NN 48/26); docs/DATA_SOURCES.md §10"

    # JavniRadar heuristics for rule D (docs/ANOMALY_DETECTION.md §D). NOT legal thresholds: they only decide when a
    # difference is large enough to show, and when the numbers look like a data entry error.
    rule-d:
      min-initial-value-eur: 10000        # D1 only for contracts with initial value >= 10.000 EUR (ANOMALY_DETECTION.md §D)
      overpayment-share: 0.10             # D2: paid more than 10 % above total with VAT (ANOMALY_DETECTION.md §D)
      overpayment-min-eur: 5000           # D2: and at least 5.000 EUR above it (ANOMALY_DETECTION.md §D)
      # Paid or total more than 10x the contracted value: in the 2026-11-02 parser check every such case was a typo in
      # the published register (missing decimal comma) or a unit-price contract, so data quality drops to "niska" and
      # the indicator is informative only (work/decisions.md, 2026-11-02).
      implausible-ratio: 10
      # Same, but at 5x when the register gives no explanation for the payment (Ivanec 2021-2022: 9-10x without any
      # note, e.g. 11.010,44 -> 110.101,44 EUR). With an explanation the 10x bound stays (work/decisions.md, #41).
      implausible-ratio-without-note: 5
      # Paid amount / contracted gross amount within this relative distance of 7,53450 (HRK per EUR): the old EOJN
      # report (A2) labels every amount "EUR", but for 2022 contracts publishers entered the paid amount in kuna
      # (2026-11-03 check: e.g. contract "82.375,00 HRK", paid "82.375,00 EUR"). Shown as informative only.
      currency-mix-tolerance: 0.015
      source: "docs/ANOMALY_DETECTION.md §D (heuristika JavniRadara, nije zakonski prag)"

    # Rule F (docs/ANOMALY_DETECTION.md §F). JavniRadar heuristics, not legal thresholds.
    rule-f:
      window-days: 90                     # first and last contract at most 90 days apart (90 counts)
      near-band: 0.70                     # "blizu praga" = >= 70 % of the threshold
      max-share-factor: 0.5               # the largest contract in the window must be >= near-band * 0.5 * threshold
      strong-min-contracts: 3             # evidence "jaka" with >= 3 contracts, each >= near-band * threshold
      recurring-cpv2: ["09", "65"]        # fuel/energy, utilities: recurring supplies, shown as "informativno"
      # Contracts from a ZJN procedure (open, restricted, negotiated...) went through public procurement, so they cannot
      # be a way around it; lots of one open procedure were 16 of 164 real F indicators (work/decisions.md, #41).
      public-procedure-markers: ["postupak"]
      source: "docs/ANOMALY_DETECTION.md §F (heuristika JavniRadara, nije zakonski prag)"

    # Rule C (docs/ANOMALY_DETECTION.md §C). JavniRadar heuristics, not legal thresholds.
    rule-c:
      period-years: 3                     # the buyer's 3 latest calendar years with contracts
      min-contracts: 5                    # without it 85 % of cells give HHI >= 5.000 (measured 2026-11-01)
      min-total-eur: 50000
      min-distinct-years: 2
      top1-share: 0.70
      hhi: 5000                           # above 2.500 counts as highly concentrated in competition practice [PRETPOSTAVKA]
      strong-min-contracts: 15            # evidence "jaka" with n >= 15
      min-top-contracts: 2                # "ponovljene dodjele": one large contract alone is not repeated awards (#41)
      natural-monopoly-cpv2: ["09", "64", "65"]   # energy, post/telecom, utilities: a note in the text only
      source: "docs/ANOMALY_DETECTION.md §C (heuristika JavniRadara, nije zakonski prag)"

    # Rule B (docs/ANOMALY_DETECTION.md §B), needs Sudreg snapshots (#46). JavniRadar heuristics, not legal thresholds.
    rule-b:
      max-age-days: 180                   # company founded at most 180 days before the contract was signed
      min-value-eur: 50000                # §B: simple procurement threshold for goods/services from 16.05.2026.
      source: "docs/ANOMALY_DETECTION.md §B (heuristika JavniRadara, nije zakonski prag)"

    # Magnitude band (nizak / srednji / visok) for filters and reports. JavniRadar heuristic, never a combined score
    # (work/decisions.md, 2026-11-03 #41). strict: true means "above" the bound, false means "at or above".
    bands:
      value-increase: {medium-from: 0.30, high-from: 0.50, strict: true}    # ZJN čl. 316 st. 2 (30 %), čl. 317 (50 %)
      overpayment: {medium-from: 0.30, high-from: 1.00, strict: true}
      splitting: {medium-from: 1.5, high-from: 2.0, strict: false}         # sum / threshold
      concentration: {medium-from: 7500, high-from: 9000, strict: false}   # HHI
      # Rule B: fewer days between founding and contract = higher band; descending means "at or below the bound".
      young-company: {medium-from: 120, high-from: 60, strict: false, descending: true}

  # Which contracts get an AI assessment (docs/ANOMALY_DETECTION.md §4.1, cost control). JavniRadar heuristics.
  ai:
    selection:
      min-value-eur: 20000                # or at least one rule indicator, or a vague subject
      min-subject-words: 4                # a subject shorter than this counts as vague
      max-contracts-per-run: 300          # ai.max_contracts_per_run
      source: "docs/ANOMALY_DETECTION.md §4.1 (heuristika JavniRadara)"
